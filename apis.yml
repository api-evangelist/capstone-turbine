aid: capstone-turbine
name: Capstone Turbine
description: >-
  Capstone Turbine Corporation, now operating as Capstone Green Energy (and its
  operating entity Capstone Energy+), is a California-based manufacturer of
  low-emission microturbine energy systems founded in 1988. The company designs
  and builds oil-free, air-bearing microturbines ranging from 65 kW to
  multi-megawatt configurations for on-site and on-demand power, combined heat
  and power (CHP), and combined cooling, heat and power (CCHP). Its systems power
  data centers, microgrids, ports, EV charging, oil and gas operations, critical
  power, and renewable energy applications. Capstone was surfaced as a portfolio
  company of Canaan Partners and added to the API Evangelist network. It is an
  industrial energy manufacturer with no public developer API, SDK, or developer
  portal; this profile captures company identity and public web properties only.
